name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check for broken internal links
        run: |
          npx astro preview --port 4321 &
          npx --yes wait-on http://localhost:4321/toleman/
          npx --yes linkinator http://localhost:4321/toleman/ --recurse --silent --skip "https?://(?!localhost:4321)"
